name: Update UUID

on:
  workflow_dispatch:   # 手动触发

jobs:
  update-uuid:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate random UUID
        id: gen
        run: |
          NEW_UUID=$(uuidgen)
          echo "uuid=$NEW_UUID" >> $GITHUB_OUTPUT

      - name: Replace UUID in _worker.js
        run: |
          FILE="_worker.js"
          if [ ! -f "$FILE" ]; then
            echo "❌ 文件 $FILE 不存在，请检查仓库根目录"
            exit 1
          fi
          sed -i.bak "s/const UUID = '.*';/const UUID = '${{ steps.gen.outputs.uuid }}';/" "$FILE"
          if grep -q "const UUID = '${{ steps.gen.outputs.uuid }}';" "$FILE"; then
            echo "✅ UUID 已更新为 ${{ steps.gen.outputs.uuid }}"
          else
            echo "❌ 替换失败，请检查文件中 UUID 声明格式是否为 const UUID = '...';"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更，可能替换未成功"
          else
            git commit -m "chore: update UUID to ${{ steps.gen.outputs.uuid }}"
            git push
          fi
